[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "termux-personal"
version = "0.1.0.dev0"
description = "Experimental local Termux control protocol client"
requires-python = ">=3.9"

[tool.setuptools.packages.find]
include = ["termux_personal*"]
