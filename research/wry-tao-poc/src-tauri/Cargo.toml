[package]
name = "wrytaopoc"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "wrytaopoc_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
log = "0.4"

[target.'cfg(target_os = "android")'.dependencies]
android_logger = "0.14"

[profile.release]
strip = true
lto = true
