<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wry/Tao PoC</title>
<style>body{font-family:sans-serif;margin:1.5em;background:#111;color:#eee} code{color:#9cf}</style>
<h1>Wry/Tao on Android</h1>
<p>Local HTML bundled in the APK. No server, no network, no Termux process.</p>
<p>Shown at <code id="t"></code>; visibility changes: <code id="v">0</code></p>
<script>
  // performance.now() at first paint approximates the WebView side of startup latency.
  const shown = Math.round(performance.now());
  document.getElementById("t").textContent = shown + " ms after navigation start";
  console.log("wrytaopoc page-shown " + shown);
  let changes = 0;
  document.addEventListener("visibilitychange", () => {
    document.getElementById("v").textContent = ++changes;
    console.log("wrytaopoc visibility " + document.visibilityState);
  });
</script>
